services:
  db:
    image: postgres:16-alpine
    container_name: inventory-operations-db
    environment:
      POSTGRES_DB: inventory_ops
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - inventory_ops_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory_ops_data:
