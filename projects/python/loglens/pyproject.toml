[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-cli"
version = "0.1.0"
description = "A dependency-free analyzer for structured JSON Lines application logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
