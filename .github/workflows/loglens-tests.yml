name: LogLens Python tests

on:
  push:
    paths:
      - "projects/python/loglens/**"
      - ".github/workflows/loglens-tests.yml"
  pull_request:
    paths:
      - "projects/python/loglens/**"
      - ".github/workflows/loglens-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install project
        run: python -m pip install -e ./projects/python/loglens
      - name: Run unit tests
        working-directory: projects/python/loglens
        run: python -m unittest discover -s tests -v
