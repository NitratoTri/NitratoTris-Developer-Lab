name: SupportDesk API CI

on:
  push:
    paths:
      - "projects/java/supportdesk-api/**"
      - ".github/workflows/supportdesk-api.yml"
  pull_request:
    paths:
      - "projects/java/supportdesk-api/**"
      - ".github/workflows/supportdesk-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven verification
        working-directory: projects/java/supportdesk-api
        run: mvn -B verify
